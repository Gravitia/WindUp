[ContentBrowser]
ContentBrowserTab1.SelectedPaths=/Game/ThirdPersonBP

; ---------------------------------------------------------------------------
; PIE 기본값 — 리슨 서버 + 플레이어 2명
;
; 이 프로젝트의 분할 화면은 "리슨 서버 + 원격 클라 1명" 을 전제로 만들어져 있다
; (UCSSplitScreenSubsystem::ResolveRemoteProxy 는 NM_Standalone 에서 nullptr 을 돌려준다).
; 단독 PIE 로 띄우면 2인 기믹도, 분할 화면도, 상대 캐릭터도 검증할 수 없다.
;
; 주의: EditorPerProjectUserSettings 는 사용자별 설정이라
;       Saved/Config/WindowsEditor/EditorPerProjectUserSettings.ini 가 이 값을 덮어쓴다.
;       이미 에디터를 써 온 사람은 Editor Preferences > Level Editor > Play 에서 한 번
;       직접 맞춰 줘야 한다. 여기 값은 새로 클론한 사람에게 적용되는 기본값이다.
; ---------------------------------------------------------------------------
[/Script/UnrealEd.LevelEditorPlaySettings]
PlayNetMode=PIE_ListenServer
PlayNumberOfClients=2
RunUnderOneProcess=True
bLaunchSeparateServer=False
