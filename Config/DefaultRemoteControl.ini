; Remote Control 웹서버를 자동으로 띄우지 않는다.
;
; RemoteControl 은 NarshaMCP 가 .uplugin 의 의존 플러그인으로 선언해 두어서
; 함께 자동 활성화된다. 우리는 NarshaMCP 의 Editor Control 을 쓰지 않으므로
; (.claude/rules/07-narsha-mcp.md) 이 서버도 쓸 일이 없다.
;
; 기본값이면 에디터를 켤 때마다 두 포트가 열린다.
;   30010  HTTP        (127.0.0.1 바인딩)
;   30020  WebSocket   (0.0.0.0 바인딩 — 같은 네트워크의 다른 기기에서 접근 가능)
;
; Remote Control 은 인증 없이 에디터 오브젝트의 프로퍼티를 읽고 쓸 수 있는 API 다.
; 안 쓰는 서버를 열어 둘 이유가 없다.
;
; 실제로 Remote Control 이 필요해지면 이 값을 True 로 되돌리기 전에
; RemoteControlWebsocketServerBindAddress 를 127.0.0.1 로 함께 지정할 것.

[/Script/RemoteControlCommon.RemoteControlSettings]
bAutoStartWebServer=False
bAutoStartWebSocketServer=False
